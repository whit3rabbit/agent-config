[package]
name = "skills-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Canonical Agent Skills store engine: install/uninstall/list skills across AI coding agents via a shared .agents/skills directory, agent symlinks, and skills-lock.json compatible with vercel-labs/skills."
repository = "https://github.com/whit3rabbit/agent-config"
keywords = ["ai", "skills", "claude", "cursor", "agents"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
yaml-rust2 = "0.10"
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
